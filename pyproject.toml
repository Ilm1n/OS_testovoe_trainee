[project]
name = "os-testovoe-trainee"
version = "0.1.0"
description = "API для бронирования столиков"
readme = "README.md"
authors = [
    { name = "Ilm1n", email = "mininiv2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["app", "tests", "migrations"]
explicit_package_bases = true
disallow_untyped_defs = true
