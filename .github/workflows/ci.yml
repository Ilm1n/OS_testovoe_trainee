name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
